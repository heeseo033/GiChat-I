<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기찾이 - 저장한 기사 - 수행평가(찬성)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Alibaba Sans TC';
      src: local('Alibaba Sans TC'), local('AlibabaSansTC-Bold');
      font-weight: 700;
    }
    body { font-family: 'Noto Sans KR', sans-serif; }
    h1, h2, h3, h4, .font-heading, .font-bold, .font-extrabold, .font-black {
      font-family: 'Alibaba Sans TC', 'Noto Sans KR', sans-serif;
    }
    .font-mono-badge { font-family: 'IBM Plex Mono', 'Noto Sans KR', monospace; }

    .article-card {
      border-color: #E2E8F0;
      transition: all 0.2s ease;
    }
    .article-card:hover {
      border-color: #7DD3FC;
    }
    .article-card:hover .card-title {
      color: #0284C7;
    }
    .article-card:has(button:hover) {
      border-color: #E2E8F0 !important;
    }
    .article-card:has(button:hover) .card-title {
      color: #0F172A !important;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-12 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-10">
      <a href="index.html" class="inline-flex items-center">
        <img src="logo.png" alt="기찾이 로고" class="h-7 w-auto object-contain">
      </a>
      <nav class="flex space-x-7 text-sm">
        <a href="index.html" class="font-medium text-slate-600 hover:text-slate-900 transition">홈</a>
        <a href="ai-search.html" class="font-medium text-slate-600 hover:text-slate-900 transition">AI 기사 찾기</a>
        <a href="search.html" class="font-medium text-slate-600 hover:text-slate-900 transition">검색</a>
        <a href="word-learning.html" class="font-medium text-slate-600 hover:text-slate-900 transition">단어 학습</a>
        <a href="saved-articles.html" class="font-bold text-[#38BDF8]">저장한 기사</a>
        <a href="mypage.html" class="font-medium text-slate-600 hover:text-slate-900 transition">마이페이지</a>
      </nav>
    </div>
    <a href="login.html" class="bg-[#38BDF8] text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-sky-500 transition">로그인</a>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto mt-10 px-4 space-y-8">

    <div class="flex justify-between items-center">
      <h2 class="text-3xl font-black text-slate-900">저장한 기사 - 수행평가(찬성)</h2>
      <a href="saved-articles.html" class="text-sm text-slate-500 underline underline-offset-2 hover:text-slate-800 transition">나가기</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <script>
        for(let i=0; i<9; i++) {
          document.write(`
            <div class="article-card border bg-white rounded-xl p-5 flex flex-col justify-between overflow-hidden shadow-2xs">
              <div onclick="location.href='saved-articles-detail.html'" class="cursor-pointer">
                <div class="flex items-center space-x-2 text-xs mb-2">
                  <span class="text-slate-700 font-medium">교육·진로</span>
                  <span class="bg-sky-100 text-sky-600 px-2 py-0.5 rounded text-[11px] font-semibold">검증 통과 97</span>
                </div>
                <h4 class="card-title font-bold text-sm text-slate-900 mb-2 leading-snug transition-colors">고교학점제 선택 과목,<br>진로별 이수 가이드 공개</h4>
                <p class="text-xs text-slate-400 mb-4 leading-relaxed">교육 당국이 진로별로 추천 과목 조합을 정리했다.</p>
              </div>
              <div class="flex justify-between items-center pt-3 border-t border-slate-100 text-xs">
                <span class="text-slate-400">연합뉴스 · 2026.10.18</span>
                <button onclick="event.stopPropagation(); toggleSave(this);" class="border border-slate-200 text-slate-700 px-3 py-1 rounded-md hover:bg-slate-50 transition">저장</button>
              </div>
            </div>
          `);
        }
      </script>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center items-center space-x-2 text-xs text-slate-500 pt-6">
      <button class="hover:text-slate-800">&lt;</button>
      <span class="font-bold text-slate-900">1</span>
      <button class="hover:text-slate-800">2</button>
      <button class="hover:text-slate-800">3</button>
      <button class="hover:text-slate-800">4</button>
      <button class="hover:text-slate-800">5</button>
      <span>...</span>
      <button class="hover:text-slate-800">10</button>
      <button class="hover:text-slate-800">&gt;</button>
    </div>

  </main>

  <script>
    function toggleSave(btn) {
      if (btn.classList.contains('is-saved')) {
        btn.classList.remove('is-saved', 'bg-[#38BDF8]', 'text-white');
        btn.classList.add('border-slate-200', 'text-slate-700', 'hover:bg-slate-50');
        btn.textContent = '저장';
      } else {
        btn.classList.add('is-saved', 'bg-[#38BDF8]', 'text-white');
        btn.classList.remove('border-slate-200', 'text-slate-700', 'hover:bg-slate-50');
        btn.textContent = '저장됨';
      }
    }
  </script>
</body>
</html>
